services:
  stub:
    build:
      context: ./stub
      dockerfile: Containerfile
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/search/shows?q=girls"]
      interval: 2s
      timeout: 2s
      retries: 10

  matchmedia:
    build:
      context: ./runner
      dockerfile: Containerfile
    volumes:
      - ../build/dist/.local/bin/matchmedia:/home/matchmedia/.local/bin/matchmedia:z
      - ../build/dist/.local/share/matchmedia/config/default.yaml:/home/matchmedia/.local/share/matchmedia/config/default.yaml:z
      - ../build/dist/.local/share/matchmedia/public:/home/matchmedia/.local/share/matchmedia/public:z
      - ./config.yaml:/home/matchmedia/.local/share/matchmedia/config/overlay.yaml:z
      - ./fixtures/library:/home/matchmedia/library:z
    environment:
      HOME: /home/matchmedia
    depends_on:
      stub:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7680/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  check:
    build:
      context: ./runner
      dockerfile: Containerfile
    volumes:
      - ../build/dist:/home/matchmedia:z
      - ./image/run:/check:z
    entrypoint: ["/bin/sh", "/check"]

  unit:
    image: docker.io/library/golang:1.26-bookworm
    volumes:
      - ../matchmedia:/src:z
    working_dir: /src
    command: ["go", "test", "-buildvcs=false", "./lib/match", "./lib/scan", "./lib/config", "./lib/jobs", "./lib/ingest", "./lib/library"]

  tester:
    build:
      context: .
      dockerfile: Containerfile
    depends_on:
      matchmedia:
        condition: service_healthy
    command: ["/smoke/run"]

  matchmedia-live:
    profiles: ["live"]
    build:
      context: ./runner
      dockerfile: Containerfile
    volumes:
      - ../build/dist/.local/bin/matchmedia:/home/matchmedia/.local/bin/matchmedia:z
      - ../build/dist/.local/share/matchmedia/config/default.yaml:/home/matchmedia/.local/share/matchmedia/config/default.yaml:z
      - ../build/dist/.local/share/matchmedia/public:/home/matchmedia/.local/share/matchmedia/public:z
      - ./live-config.yaml:/home/matchmedia/.local/share/matchmedia/config/overlay.yaml:z
    environment:
      HOME: /home/matchmedia
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7680/health"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 15s

  live:
    profiles: ["live"]
    build:
      context: .
      dockerfile: Containerfile
    depends_on:
      matchmedia-live:
        condition: service_healthy
    command: ["/live/run"]
