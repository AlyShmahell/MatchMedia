http:
  deadline_ms: 60000
  retries: 5
  backoff:
    min_ms: 1024
    max_ms: 8192
  attempt_ms: 10000
  cooldown:
    fails: 5
    min_ms: 32768
    max_ms: 524288
version: "0.1.1"
match:
  min_score: 0.72
  min_margin: 0.04
  min_hits: 1
  workers: 8
  prefer:
    anime:
      language: Japanese
      kind: Animation
  title_lift: 0.15
  exact_lift: 0.25
  plot_stop: [a, an, the, of, to, in, on, at, is, and, or, my, i, this, that, for, with, from, as, by]
  synopsis_limit: 4000
group:
  parent_weight: 1
  distance_threshold: 0.49
  video_ext: [mkv, mp4, avi, m4v, ts, m2ts]
  season_pattern: '(?i)^(season\s*\d+|ovas?|specials?|movies?|others?|extras?|s\d{1,2})$'
ingest:
  seq_threshold: 0.72
  sample_rows: 3
  aliases:
    mediatype: type
    seasonnumber: season
    episodenumber: episode
    imdbid: imdb
  types:
    tv: tv
    anime: anime
    movie: movie
    series: tv
    episode: tv
    season: tv
    film: movie
providers:
  tmdb:
    use: primary
    require: api_key
    api_key: ""
    base: "https://api.themoviedb.org/3"
    query: { api_key: "{api_key}", query: "{title}", include_adult: "false" }
    items: results
    year: prefix4
    poster_prefix: "https://image.tmdb.org/t/p/w185"
    movie:
      types: [movie, anime]
      url: "{base}/search/movie"
      fields: { id: id, title: title, year: release_date, url: id, synopsis: overview, poster: poster_path }
      url_prefix: "https://www.themoviedb.org/movie/"
      nfo: movie
      uniqueid: tmdb-movie
    tv:
      types: [tv, anime]
      url: "{base}/search/tv"
      fields: { id: id, title: name, year: first_air_date, url: id, synopsis: overview, poster: poster_path }
      url_prefix: "https://www.themoviedb.org/tv/"
      nfo: tvshow
      uniqueid: tmdb-tv
      catalog:
        seasons:
          url: "{base}/tv/{id}"
          query: { api_key: "{api_key}" }
          items: seasons
          fields: { id: id, number: season_number, title: name, synopsis: overview, poster: poster_path }
          poster_prefix: "https://image.tmdb.org/t/p/w185"
        episodes:
          url: "{base}/tv/{id}/season/{season}"
          query: { api_key: "{api_key}" }
          items: episodes
          fields: { id: id, number: episode_number, title: name, synopsis: overview, poster: still_path }
          poster_prefix: "https://image.tmdb.org/t/p/w185"
  omdb:
    use: defer
    types: [movie]
    require: api_key
    api_key: ""
    base: "https://www.omdbapi.com"
    url: "{base}"
    query: { apikey: "{api_key}", s: "{title}", type: "movie" }
    items: Search
    fields: { id: imdbID, title: Title, year: Year, url: imdbID, poster: Poster }
    url_prefix: "https://www.imdb.com/title/"
    nfo: movie
    uniqueid: imdb
    detail:
      url: "{base}"
      query: { apikey: "{api_key}", i: "{id}", plot: "short" }
      fields: { synopsis: Plot }
  tvmaze:
    use: fallback
    types: [tv, anime, ""]
    min_interval_ms: 128
    retries: 2
    base: "https://api.tvmaze.com"
    url: "{base}/search/shows"
    query: { q: "{title}" }
    items: "$"
    fields: { id: show.id, title: show.name, year: show.premiered, url: show.url, synopsis: show.summary, poster: show.image.medium, kind: show.type, language: show.language }
    year: prefix4
    titles:
      url: "{base}/shows/{id}/akas"
      items: "$"
      fields: { title: name }
      max: 3
    episode:
      url: "{base}/shows/{id}/episodebynumber"
      query: { season: "{season}", number: "{episode}" }
      fields: { id: id, title: name, year: airdate, url: url }
      year: prefix4
    catalog:
      seasons:
        url: "{base}/shows/{id}/seasons"
        items: "$"
        fields: { id: id, number: number, title: name, synopsis: summary, poster: image.medium, year: premiereDate }
        year: prefix4
      episodes:
        url: "{base}/shows/{id}/episodes"
        items: "$"
        fields: { id: id, number: number, title: name, synopsis: summary, poster: image.medium, season: season, year: airdate }
        year: prefix4
    nfo: tvshow
